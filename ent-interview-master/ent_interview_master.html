function getCenterQuestions(center) {
  var emphWords = center.emphasis.join(' ').toLowerCase().split(/\W+/).filter(function(w){ return w.length > 3; });
  var scored = allQuestions.map(function(q) {
    var haystack = (q.sgName + ' ' + q.catName + ' ' + q.question).toLowerCase();
    var score = emphWords.filter(function(w){ return haystack.includes(w); }).length;
    return Object.assign({}, q, { score: score });
  });
  scored.sort(function(a,b){ return b.score - a.score || Math.random() - 0.5; });
  return scored.slice(0, 4);
}

function useFileData() {
  var [answers, setAnswers] = React.useState({});
  var [checked, setChecked] = React.useState({});
  var [wrong, setWrong] = React.useState({});
  var saveTimer = React.useRef(null);
  var stateRef = React.useRef({ answers: {}, checked: {}, wrong: {} });

  React.useEffect(function() {
    function apply(d) {
      var a = d.answers || {}, c = d.checked || {}, w = d.wrong || {};
      stateRef.current = { answers: a, checked: c, wrong: w };
      setAnswers(a); setChecked(c); setWrong(w);
    }
    // Try the local server (when launched via the .command); otherwise fall
    // back to localStorage layered over the data baked into this file.
    fetch('/data').then(function(r){ if (!r.ok) throw 0; return r.json(); })
      .then(function(d){ apply(d); })
      .catch(function() { apply(lsLoad() || EMBEDDED_DATA); });
  }, []);

  function scheduleSave() {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(function() {
      lsSave(stateRef.current);
      fetch('/save', { method: 'POST', body: JSON.stringify(stateRef.current) }).catch(function(){});
    }, 800);
  }
  function updateAnswers(fn) { setAnswers(function(prev){ var next = fn(prev); stateRef.current = Object.assign({}, stateRef.current, { answers: next }); scheduleSave(); return next; }); }
  function updateChecked(fn) { setChecked(function(prev){ var next = fn(prev); stateRef.current = Object.assign({}, stateRef.current, { checked: next }); scheduleSave(); return next; }); }
  function updateWrong(fn)   { setWrong(function(prev){   var next = fn(prev); stateRef.current = Object.assign({}, stateRef.current, { wrong: next });   scheduleSave(); return next; }); }
  function importAll(d) {
    var a = d.answers || {}, c = d.checked || {}, w = d.wrong || {};
    stateRef.current = { answers: a, checked: c, wrong: w };
    setAnswers(a); setChecked(c); setWrong(w);
    scheduleSave();
  }
  return { answers, checked, wrong, updateAnswers, updateChecked, updateWrong, importAll };
}

    "0_0_2": "<p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"></p><span style=\"font-size: 14px;\"><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🧭 Principle:<br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">&nbsp;\"Patient safety is non-negotiable — and I also understand that my senior is <span style=\"background-color: rgb(255, 255, 136);\">human</span>. They may be temporarily unavailable for any number of reasons.</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">⚙️ Action: <b style=\"background-color: rgb(255, 255, 136);\">Stabilize</b>&nbsp;<br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"I would attempt to reach my second on-call again while simultaneously initiating whatever stabilization measures are within my scope. If there is still no response, I escalate immediately to my third on-call. The chain of escalation exists precisely for moments like this — I would use it without hesitation.\"</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🎭 Human Moment:</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">N/A&nbsp;</p></span><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"></p>",
    "0_0_3": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong></strong></p><span style=\"font-size: 14px;\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle:</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"These situations are rare, but they do happen — which is why I believe in planning ahead and keeping the right people informed.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action: <span style=\"background-color: rgb(255, 255, 136);\">Plan Ahead &amp; Sleep deprived?</span></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"Whenever I know I will be traveling around an on-call date, I make it a point to inform my chief in advance, flag the potential risk, and request a backup arrangement in case of any delays. If the situation arises unexpectedly — for example, if I only learn of the delay at the last moment — I would contact my chief immediately, be transparent about my situation, and either arrange cover until I arrive, or take the full shift off if I am not in a fit state to perform clinical duties safely after travel.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong>&nbsp;N/A ✅</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p></span><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"></p>",
    "0_1_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle: Responsibility,&nbsp;</strong>&nbsp;</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"I see marriage as a responsibility I take seriously — and like residency, it requires honest communication and mutual understanding from the start.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><strong><font color=\"#000000\"><span style=\"caret-color: rgb(0, 0, 0);\">⚙️ Action: &nbsp;Demanding&nbsp;</span></font></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"I am not currently married, and I am planning to get married within the next two years, inshallah. I am fully aware that residency is demanding, and I intend to be upfront with my partner about that from day one — that there will be long hours, difficult days, and times where I am not as available as either of us would like. I <span style=\"background-color: rgb(255, 255, 136);\">believe that transparency </span>before marriage is what makes the transition manageable.\"<br></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong>&nbsp;<br></p><div><br></div>",
    "0_1_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;: <b>Family emergency &amp; life&nbsp;</b></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"Family emergencies are a reality of life, and I believe the right response is always to stay calm, assess the situation, and act proportionately/accordingly.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action:</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">&nbsp;\"I don't have children yet, but I can relate — I would think of it the way I would if my mother called me about a sick sibling. My first step would be to briefly triage the situation over the phone: is there a fever, are there any red flags, how is the child's overall condition. If it turns out to be nothing serious, I would complete my clinic and follow up immediately after. If there are genuine concerns, I would speak to my senior, explain the situation honestly, and request to be excused — trusting that the team would understand, just as I would for any of them.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong>&nbsp;</p><div><br></div>",
    "0_1_2": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle: Unmet expectations&nbsp;</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">&nbsp;\"I believe that most marital tensions during residency stem from unmet expectations — and the antidote to that is honest communication, not ultimatums.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action:</strong>&nbsp;</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"If my wife asked me to leave the program, my first response would not be to choose — it would be to understand. I would want to know what is driving that request, what she is feeling, and what we can realistically do together to address it. I would make every effort to find a <b>middle ground</b> — whether that means more intentional time together, seeking counseling, or restructuring how I manage my commitments at home. However, if after all of that we still could not find a resolution, I will be honest — ENT is a core part of who I am. It is not something I pursued lightly, and it is not something I could walk away from. <span style=\"background-color: rgb(255, 255, 136);\">I hope it never reaches that point, and I believe it would not — because I intend to choose my partner with that understanding already in place.</span>\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong>&nbsp;<br></p><div><br></div>",
    "0_1_3": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle:</strong>&nbsp;</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"This comes down to planning ahead — and making sure the support system around my family is established well before residency begins, <b>not figured out on the night of an on-call.</b>\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action:</strong>&nbsp;</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"I would ensure that my on-call schedule is shared with my wife well in advance. On days where she is also working or unavailable, we would have a pre-arranged plan with our families — grandparents, close relatives — <b>who are aware of the demands of residency and are prepared to step in in such cases</b>. These situations are entirely expected in residency, and I believe the families of residents play a quiet but essential role in making it all work.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment:</strong></p><div><br></div>",
    "0_2_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🌟 Safety · Efficiency · Teamwork</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"I wouldn't ask you to rank me number one because of a title or a grade — I would ask you to rank me number one because of what I will bring to this program every single day.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong></p><p class=\"font-claude-response-body break-words whitespace-pre-wrap leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🔵 Before \"I graduated top of my class — not because medicine came easy, but because I was consistent when it was hard. I contributed to research during medical school, which gave me enormous clinical insight and taught me how to think beyond what is expected.\"</p><p class=\"font-claude-response-body break-words whitespace-pre-wrap leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🟢 Now \"I chose ENT specifically — not as a fallback, not as a backup plan. I built everything around that decision, not the other way around. I'd rather make the person next to me better than be the loudest one in the room. And when it comes to my patients — I don't take shortcuts. A safe physician isn't someone who never makes mistakes — it's someone who builds systems to catch them, speaks up when something doesn't feel right, and puts the patient above their own comfort.\"</p><p class=\"font-claude-response-body break-words whitespace-pre-wrap leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🟡 Later \"I believe great residency training is built on safety, efficiency, and teamwork. I saw those values in action during my electives, I've already begun building that skill set, and I'm ready to bring it from day one.\"</p><p class=\"font-claude-response-body break-words whitespace-pre-wrap leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🔴 Prevent \"I want to be part of a culture where every task has an owner, every member has a role, and nothing falls through the cracks.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🏰 The Story: ....?&nbsp;</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong>&nbsp;\"I can't tell you to rank me number one — but if you did, I'll make sure you never regret it.\"&nbsp;<em>(smile)</em></p>",
    "0_2_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"I will not list adjectives — I will tell you what the people who have worked with me have seen.\"</p><div><br></div><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong>&nbsp;</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">-The first is consistency. I graduated top of my class not through bursts of effort but through showing up every single day — and that is exactly how I approach clinical work.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">-The second is composure under pressure. Medicine has a way of testing you when you least expect it, and I have learned — through call nights and difficult cases — that staying calm is itself a clinical skill.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">-The third is that I am coachable. I take feedback seriously, I do not let my ego get in the way of learning, and <b>I genuinely believe the best residents are the ones who know how much they still have to learn.</b>\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong>&nbsp;\"I suppose the real test is whether this matches what my supervisors would say — and I am confident it does.\" (smile)</p>",
    "0_2_2": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong><span style=\"font-family: -webkit-standard; font-size: medium;\">&nbsp;:</span></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><span style=\"font-family: -webkit-standard; font-size: medium;\">\"Honestly, I cannot compare myself to candidates I have never met — and I do not think that is the right frame. What I can tell you is what I bring.\"</span></p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong><br></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"I bring three things:</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">First — consistency. Not in bursts, but every single day regardless of circumstances.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Second — genuine commitment to ENT. This did not start with the application. I have worked toward this specifically and built habits around it long before interviews.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Third — I am here to grow, not just pass through. I am coachable, I take feedback seriously, and I make the people around me better in the process.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>Concept map to memorize:</strong></p><blockquote class=\"ml-2 border-l-4 border-[hsl(var(--border-300)/0.1)] pl-4 text-text-300\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\">Refuse → Consistency → Commitment → Growth mindset → Smile</p></blockquote>",
    "0_3_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"Conflict with a senior is inevitable in any high-pressure environment — what matters is that it never reaches the patient, and that it is handled with maturity and respect.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"First — I would never address a conflict in the moment if emotions are running high. I would wait for the right time and place.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Second — I would approach my senior privately, speak honestly about what I observed or felt, and listen to their perspective without assuming I am right.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Third — if we could not resolve it between us, I would escalate to the chief. Not as an act of aggression, but because unresolved tension in a team ultimately affects everyone — including the patient.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong></p>",
    "0_3_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"Conflict with a senior is inevitable in any high-pressure environment — what matters is that it never reaches the patient, and that it is handled with maturity and respect.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"First — I would never address a conflict in the moment if emotions are running high. I would wait for the right time and place.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Second — I would approach my senior privately, speak honestly about what I observed or felt, and listen to their perspective without assuming I am right.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Third — if we could not resolve it between us, I would escalate to the chief. Not as an act of aggression, but because unresolved tension in a team ultimately affects everyone — including the patient.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong></p>",
    "0_3_2": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"I understand that high-pressure environments can push people past their limits — but being shouted at in front of a patient is something I would never ignore, because it affects the patient's trust and the integrity of the team.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"First — in the moment, I would stay completely calm and not respond. Reacting while my senior is already upset would only escalate things and distract from the patient in front of us.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Second — once the encounter is over and things have settled, I would approach my senior privately. I would genuinely try to understand what triggered the reaction and reflect on whether I made an error.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Third — regardless of whether I was at fault, I would respectfully but clearly communicate that I do not accept being addressed that way in front of a patient. It undermines the patient's confidence, and it damages the trust between us as colleagues.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Fourth — if it happened again or went unacknowledged, I would escalate to the chief. Not out of pride, but because a team that cannot communicate respectfully cannot function safely.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong></p>",
    "0_4_2": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"I believe every stage of training demands a different approach to learning — and I am honest enough to know that what worked in medical school will need to evolve in residency.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"Throughout medical school I relied primarily on AMBOSS for conceptual understanding, and UpToDate when I needed a more structured clinical approach to a specific case or condition. These served me well as a student.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">However, I am aware — from speaking to residents — that residency demands more. Textbooks, primary literature, and specialty-specific resources become essential when you are managing real patients at a higher level of responsibility.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">I am actively preparing for that shift, and I am genuinely open to guidance from my seniors on what references have served them best in this program specifically.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong></p>",
    "0_4_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"I believe deeply in the value of having someone to look up to — but I have never been able to limit that to one person.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🔵 Before — \"Growing up I was always drawn to different qualities in different people — a teacher's patience, a senior's composure, a colleague's work ethic.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🟢 Now — \"Rather than one role model, I have built a composite — I take the best of every person I encounter and hold myself to that standard. In that sense, everyone I respect becomes part of the model I am trying to live up to.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🟡 Later — \"What this means in practice is that I am always watching, always learning, and never assuming I have found the ceiling.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🔴 Prevent — N/A</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong></p>",
    "0_9_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;\"In a specialty that carries oncology, anger from patients and families is not surprising — it is human. Behind every angry patient is a fear that has not been addressed yet.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>⚙️ Action</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🔵 Before — \"I always try to be aware of the emotional weight a patient may be carrying before they even open their mouth.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🟢 Now — \"In the moment I would not react to the anger — I would absorb it. I would acknowledge what they are feeling, lower my own tone, and if we are in a public space I would gently invite them to a private area so they feel safe to speak freely.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🟡 Later — \"Once they are calm I would try to understand the root of the issue — whether it is a communication gap, a waiting time, a clinical concern — and address it as concretely as I can. If it is beyond my capacity to resolve, I would involve the right person immediately.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">🔴 Prevent — \"Most angry patients I have seen were angry because they felt unheard. If I make them feel heard from the start, the anger rarely escalates.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong></p>",
    "0_9_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"A 67 year old patient presented to clinic requesting a septoplasty. He had an incidental finding of a deviated nasal septum on imaging — and the moment he became aware of it, he was convinced he needed surgery. The challenge was that he had absolutely no breathing complaints, no functional symptoms whatsoever.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">I was present during the encounter, and it was the resident who took the lead. What struck me was how difficult it was to redirect the patient — he kept coming back to the fact that the deviation was there, visible and documented, and in his mind that meant it needed to be fixed.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Watching how the resident handled it taught me a great deal. He listened fully, acknowledged the patient's concern, and then walked him through the reasoning clearly — that we do not operate on findings, we operate on patients. A deviation without symptoms in a 67 year old carries real surgical risk with no real benefit.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">By the end of the consultation the patient understood, and they reached a shared decision together. That encounter stayed with me — because it showed me that sometimes the best thing you can do for a patient is protect them from an operation they do not need.\"</p>",
    "0_6_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">The transition from medical student to intern is one of the most sudden shifts you will ever experience in medicine. One day you are an observer — watching, learning, standing at the periphery. The next day you are part of the team, and the weight of that responsibility lands on you before you feel ready for it.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">But what I learned is that the difficulty of that transition is precisely the point. It is in those early uncomfortable months that you discover what you are actually made of — how you handle uncertainty, how you communicate under pressure, how you show up for your team even when you are exhausted.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">And when that moment finally comes — when you realize you are no longer just watching but genuinely contributing — it is one of the best feelings medicine has to offer.</p>",
    "0_6_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"During one of my clinic rotations, a patient presented with a complaint of hearing his own voice when speaking — autophony — along with intermittent popping sounds in his ear. Honestly, my first thought was Eustachian tube dysfunction, but I could not piece together the full picture.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">The resident came in, asked me to present the case, and then asked the patient what seemed like a completely random question — 'Have you lost a significant amount of weight recently?'</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">The patient paused, surprised, and confirmed that yes — he had lost a considerable amount of weight in a short period of time.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">The resident explained that rapid weight loss can cause loss of the peripharyngeal fat pad that normally keeps the Eustachian tube closed — leading to a patulous Eustachian tube, where the tube stays abnormally open. That was the cause of everything the patient had been experiencing.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">What made this case stay with me was not just the diagnosis — it was the patient's reaction. He said that he had been to multiple clinics and no one had ever connected his symptoms to his weight loss. In that one question, the resident gave him an explanation that finally made sense of months of frustration.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">That moment taught me that a thorough history is not just about systems — it is about seeing the whole person in front of you.\"</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p>",
    "2_3_0": "Curious<div><br></div><div><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Because I find everything worth understanding — medicine, systems, people, ideas. Not just what things are, but why they work the way they do</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">The ENT passion, the investing threads, the Jarvis ecosystem.</p><p style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">Curiosity is the engine under all of it.</p></div>",
    "2_3_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>\"Relentless. Curious. Adaptable.\"</strong></p><ul class=\"[li_&amp;]:mb-0 [li_&amp;]:mt-1 [li_&amp;]:gap-1 [&amp;:not(:last-child)_ul]:pb-1 [&amp;:not(:last-child)_ol]:pb-1 list-disc flex flex-col gap-1 pl-8 mb-3\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Relentless</strong>&nbsp;— I don't stop at good enough. Valedictorian wasn't a title I chased — it was a byproduct of refusing to leave gaps in my understanding.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Curious</strong>&nbsp;— ENT chose me as much as I chose it. The more I learned about the ear, the cochlea, the surgical precision involved — the deeper I wanted to go.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Adaptable</strong>&nbsp;— Internship is controlled chaos. Different teams, different paces, different expectations every rotation. I learned to read the room and deliver regardless.</li></ul>",
    "2_1_2": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>Q: Last non-medical book you read?</strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em>\"I've always been drawn to fiction that keeps you thinking. Recently I finished</em>&nbsp;Inferno&nbsp;<em>by Louise Cooper — part of a fantasy series. Before that I've gone through Dan Brown's series, Agatha Christie's</em>&nbsp;The Man in the Brown Suit,&nbsp;<em>J.K. Rowling's</em>&nbsp;The Cuckoo's Calling,&nbsp;<em>and Jeffrey Archer's</em>&nbsp;Only Time Will Tell.&nbsp;<em>I tend to gravitate toward stories built around mystery, strategy, and characters who operate under pressure&nbsp;</em></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em><br></em></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em><br></em></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em>\"I've always made time for reading outside medicine — I tend to gravitate toward mystery, strategy, and characters under pressure:\"</em></p><ul class=\"[li_&amp;]:mb-0 [li_&amp;]:mt-1 [li_&amp;]:gap-1 [&amp;:not(:last-child)_ul]:pb-1 [&amp;:not(:last-child)_ol]:pb-1 list-disc flex flex-col gap-1 pl-8 mb-3\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Inferno – Louise Cooper</strong>&nbsp;— Fantasy series. A woman cursed to hunt demons she herself unleashed. About owning your mistakes and relentlessly correcting them. She can never rest until every demon is recaptured.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Dan Brown – Robert Langdon Series</strong>&nbsp;— A Harvard symbologist racing through art, history and conspiracy across Europe. In&nbsp;<em>Inferno</em>&nbsp;specifically, Langdon fails to stop the virus — it's already released — but it turns out to be a sterilizing agent, not a killer. Ends on a moral dilemma, not a clean win.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Agatha Christie – The Man in the Brown Suit</strong>&nbsp;— A bored young woman witnesses a suspicious death in London and follows the trail to South Africa. Christie's classic trick: the villain is the charming aristocrat hiding in plain sight the whole time.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>J.K. Rowling – The Cuckoo's Calling</strong>&nbsp;— A broke war-veteran detective hired to prove a supermodel was murdered. The twist: the client who hired him is the killer.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Jeffrey Archer – Only Time Will Tell</strong>&nbsp;— A dock worker's son rising through 1920s England trying to uncover who his father really was. Ends on a deliberate cliffhanger — the question is never answered in Book 1.</li></ul><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em><br></em></p>",
    "2_1_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em>\"I try to be intentional about how I spend my time outside the hospital:\"</em></p><ul class=\"[li_&amp;]:mb-0 [li_&amp;]:mt-1 [li_&amp;]:gap-1 [&amp;:not(:last-child)_ul]:pb-1 [&amp;:not(:last-child)_ol]:pb-1 list-disc flex flex-col gap-1 pl-8 mb-3\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Gym</strong>&nbsp;— Non-negotiable. Keeps me disciplined and mentally sharp regardless of how demanding the week is.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Reading</strong>&nbsp;— Across genres: fantasy, thriller, historical fiction. Jeffrey Archer, Agatha Christie, Dan Brown.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Investing</strong>&nbsp;— I actively follow markets, track IPOs, and manage my own portfolio. It's taught me patience and long-term thinking.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Music, films &amp; anime</strong>&nbsp;— One Piece has been a long-running companion. I find switching off creatively helps me reset.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Building my second brain</strong>&nbsp;— I use Notion and Anki to organise and retain knowledge. I genuinely enjoy optimising how I learn — I treat my own mind like a system worth engineering.</li></ul>",
    "2_1_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em>\"A few things I keep coming back to:\"</em></p><ul class=\"[li_&amp;]:mb-0 [li_&amp;]:mt-1 [li_&amp;]:gap-1 [&amp;:not(:last-child)_ul]:pb-1 [&amp;:not(:last-child)_ol]:pb-1 list-disc flex flex-col gap-1 pl-8 mb-3\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Fitness</strong>&nbsp;— Gym is a lifestyle, not just a hobby. Consistency there carries over into how I approach everything else.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Reading</strong>&nbsp;— Fiction mostly. Christie, Archer, Dan Brown. I like stories where someone has to think under pressure.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Personal investing</strong>&nbsp;— I follow markets and manage my own portfolio. It's become a genuine intellectual hobby, not just a financial one.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Anime &amp; film</strong>&nbsp;— One Piece has been running in the background of my life for years. It's how I decompress.</li><li class=\"font-claude-response-body whitespace-normal break-words pl-2\"><strong>Knowledge systems</strong>&nbsp;— Building and refining how I learn using Notion and Anki. Most people wouldn't call it a hobby but for me it genuinely is — I find it satisfying the same way others find puzzles satisfying.</li></ul>",
    "2_2_1": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>CHUNK 1 — WHO I AM</strong>&nbsp;<em>(10 seconds)</em>&nbsp;\"My name is Yahya Samman. I'm 25, born and raised in Jeddah — a KSAU-HS alumnus, graduated valedictorian, first in my class, with a GPA of 4.98.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><br><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong style=\"font-size: 14px;\">CHUNK 2 — WHY ENT</strong><span style=\"font-size: 14px;\">&nbsp;</span><br></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>WHY ENT</strong><span style=\"font-family: -webkit-standard; font-size: medium;\">&nbsp;</span><span style=\"font-family: -webkit-standard; font-size: medium;\">I was seriously considering neurosurgery for most of medical school — the complexity drew me in. But when I got to the wards, I realized the scope was narrow, the prognosis was heavy, and the day-to-day left little room for the kind of diverse, evolving practice I wanted. ENT was the complete opposite. It's surgical and medical. The skill set never stops growing — microsurgery, endoscopy, head and neck oncology, rehabilitation. The patient population spans every age. The subspecialties are deep enough to spend a career in any one of them. And the prognosis — you actually see people recover, hear, breathe, speak again. No other specialty gave me that combination. ENT was the only one where I genuinely lost track of time.</span><br></p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>CHUNK 3 — PROOF</strong>&nbsp;<em>(rapid fire, confident)</em>&nbsp;\"I have publications in Q1-Q2 journals, hands-on in-vitro and in-vivo lab experience, ongoing systematic reviews in ENT, and both national and international conference presentations.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong><br></strong></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>CHUNK 4 — BEYOND THE LAB</strong>&nbsp;<em>(one breath)</em>&nbsp;\"I also led multiple public awareness campaigns throughout medical school and hosted a medical podcast at KSAU-HS.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\"><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><b>CHUNK 5 </b>— THE CLOSE (conversational, then land it) \"Outside medicine —&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">- I enjoy fiction, I recently am reading Inferno by Louise Cooper, a story about how unchecked curiosity can become someone's undoing — I found that thought-provoking .&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">- I also have a passion for building things. In my free time I build personal productivity tools and automate my own workflow using AI — I currently have a working AI-powered personal assistant I built from scratch.&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">- And I train as much as I can .&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><span style=\"background-color: rgb(255, 255, 136);\">I'm here because I want to train at the highest level — and I've spent six years making sure I'd be ready.\"</span></p><div style=\"border: 0px solid color(srgb 1 1 1 / 0.1); outline-color: rgb(85, 153, 231); scrollbar-width: thin; color: rgb(255, 255, 255); font-family: &quot;Anthropic Sans&quot;, system-ui, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif, ui-sans-serif, system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, sans-serif; font-size: 14px; font-variant-ligatures: normal; background-color: rgb(31, 31, 30);\"><div data-test-render-count=\"1\" style=\"border: 0px solid color(srgb 1 1 1 / 0.1); outline-color: rgb(85, 153, 231); scrollbar-width: thin;\"><div class=\"group\" style=\"border: 0px solid color(srgb 1 1 1 / 0.1); outline-color: rgb(85, 153, 231); scrollbar-width: thin; height: auto; opacity: 1; transform: none;\"><div class=\"contents\" style=\"border: 0px solid color(srgb 1 1 1 / 0.1); outline-color: rgb(85, 153, 231); scrollbar-width: thin; display: contents;\"></div></div></div></div>",
    "2_2_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>CHUNK 1 — WHO I AM</strong>&nbsp;<em>(10 seconds)</em>&nbsp;\"My name is Yahya Samman. I'm 25, born and raised in Jeddah — a KSAU-HS alumnus, graduated valedictorian, first in my class, with a GPA of 4.98.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\" style=\"font-size: 14.000001px;\"><br style=\"font-size: 14.000001px;\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong style=\"font-size: 14px;\">CHUNK 2 — WHY ENT</strong><span style=\"\">&nbsp;</span></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><span style=\"\"></span><br></p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\"><font color=\"#000000\"><span style=\"caret-color: rgb(0, 0, 0); font-size: 14px;\">Reaching ENT was not easy. At first I was&nbsp;</span></font>seriously considering neurosurgery for most<span style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-size: medium; font-family: -webkit-standard;\">&nbsp;of medical school — the complexity drew me in. But when I got to the wards, the emotional weight of the prognosis was something I knew I couldn't sustain long-term, and the day-to-day left little room for the kind of diverse, evolving practice I wanted. ENT was the complete opposite. It's surgical — and it has a rich outpatient dimension that makes you a complete physician. The skill set never stops growing — microsurgery, endoscopy, head and neck oncology. The patient population spans every age. And the prognosis — you actually see people recover, hear, breathe, speak again. No other specialty gave me that combination.</spa ong>&nbsp;<em>(one breath)</em>&nbsp;\"I also led multiple public awareness campaigns throughout medical school and hosted a medical <span style=\"background-color: rgb(255, 182, 193);\">podcast</span> at KSAU-HS.\"</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\" style=\"font-size: 14.000001px;\"><p data-pm-slice=\"0 0 []\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><b>CHUNK 5&nbsp;</b>— THE CLOSE (conversational, then land it) \"Outside medicine —&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">- I enjoy fiction, I recently am reading Inferno by Louise Cooper, a story about how unchecked curiosity can become someone's undoing — I found that thought-provoking .&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">- I also have a passion for building things. In my free time I build personal productivity tools and automate my own workflow using AI — I currently have a working AI-powered personal assistant I built from scratch.&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">- And I train as much as I can .&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><span style=\"background-color: rgb(255, 255, 136);\">I'm here because I want to train at the highest level — and I've spent six years making sure I'd be ready.\"</span></p>",
    "2_0_0": "<font color=\"#000000\" style=\"font-size: 14.000001px;\"><span style=\"font-size: 14px;\">Reaching ENT was not easy. At first I was&nbsp;</span></font><span style=\"font-size: 14.000001px;\">seriously considering neurosurgery&nbsp;</span><span style=\"font-size: 14.000001px;\">for most</span><span style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-size: medium; font-family: -webkit-standard;\">&nbsp;of medical school — the complexity drew me in. But when I got to the wards, the emotional weight of the prognosis was something I knew I couldn't sustain long-term, and the day-to-day left little room for the kind of diverse, evolving practice I wanted. ENT was the complete opposite. It's surgical — and it has a rich outpatient dimension that makes you a complete physician. The skill set never stops growing — microsurgery, endoscopy, head and neck oncology. The patient population spans every age. And the prognosis — you actually see people recover, hear, breathe, speak again. No other specialty gave me that combination.</span><br>",
    "2_0_1": "<p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">\"Honestly — I know because of how I feel when I'm in it.&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">In every other specialty I was <b>present</b>. In ENT I was <b>invested</b>. I found myself reading beyond what was required, asking questions I wasn't assigned to ask, and genuinely looking forward to going back.&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><b>That kind of pull isn't something you manufacture</b>.&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><br></p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\">And the patients — I've never felt as connected to a patient's outcome as I do in ENT.&nbsp;</p><p data-pm-slice=\"0 0 []\" style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><b>When someone hears for the first time after a cochlear implant&nbsp;</b>— that moment stays with you. I want a career full of those moments. That's how I know.\"</p>",
    "2_0_2": "<font color=\"#000000\" style=\"font-size: 14.000001px;\"><span style=\"font-size: 14px;\">Reaching ENT was not easy. At first I was&nbsp;</span></font><span style=\"font-size: 14.000001px;\">seriously considering neurosurgery&nbsp;</span><span style=\"font-size: 14.000001px;\">for most</span><span style=\"caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0); font-size: medium; font-family: -webkit-standard;\">&nbsp;of medical school — the complexity drew me in. But when I got to the wards, the emotional weight of the prognosis was something I knew I couldn't sustain long-term, and the day-to-day left little room for the kind of diverse, evolving practice I wanted. ENT was the complete opposite. It's surgical — and it has a rich outpatient dimension that makes you a complete physician. The skill set never stops growing — microsurgery, endoscopy, head and neck oncology. The patient population spans every age. And the prognosis — you actually see people recover, hear, breathe, speak again. No other specialty gave me that combination.</span><br>",
    "4_0_0": "<p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🧭 Principle</strong>&nbsp;Patient safety is the highest priority — but my response has to be proportional to the risk. Not every lapse carries the same urgency.</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\" style=\"font-size: 14.000001px;\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🔵 Before</strong>&nbsp;First — I check myself. Am I certain this is poor care, or is there clinical reasoning beyond my current level of knowledge? I acknowledge my limits as a resident. There are decisions that look wrong from the outside that make complete sense with more context.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🟢 Now</strong>&nbsp;I triage the situation immediately:</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em>Is this life-threatening?</em>&nbsp;→ I escalate right now. No private conversation first, no waiting. I go to the highest available authority and I document everything in real time. The patient's life comes before anyone's comfort.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><em>Is this suboptimal but not immediately dangerous?</em>&nbsp;→ I approach the consultant privately and respectfully — framing it as seeking understanding, not accusation.&nbsp;<em>\"I wanted to clarify the plan for this patient — I may be missing something.\"</em>&nbsp;That gives them room to correct course with dignity. If they dismiss me and I'm still certain — I escalate.</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🟡 Later</strong>&nbsp;</p><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🔴 Prevent</strong>&nbsp;</p><hr class=\"border-border-200 border-t-0.5 my-3 mx-1.5\" style=\"font-size: 14.000001px;\"><p class=\"font-claude-response-body break-words whitespace-normal leading-[1.7]\" style=\"font-size: 14.000001px; caret-color: rgb(0, 0, 0); color: rgb(0, 0, 0);\"><strong>🎭 Human Moment</strong></p>",

function RichTextEditor({ value, onChange, placeholder }) {
  var ref = React.useRef(null);
  var isOwn = React.useRef(false);
  var savedSel = React.useRef(null);
  var lastHigh = React.useRef('#FFE99B');
  var [showColors, setShowColors] = React.useState(false);
  var [showHigh, setShowHigh] = React.useState(false);

  React.useEffect(function() {
    if (ref.current && !isOwn.current && document.activeElement !== ref.current) {
      ref.current.innerHTML = value || '';
    }
  }, [value]);

  function saveSel() { var s = window.getSelection(); if (s && s.rangeCount > 0) savedSel.current = s.getRangeAt(0).cloneRange(); }
  function restSel() { if (!savedSel.current || !ref.current) return; ref.current.focus(); var s = window.getSelection(); if (s) { s.removeAllRanges(); s.addRange(savedSel.current); } }
  function handleInput() { isOwn.current = true; if (ref.current) onChange(ref.current.innerHTML); setTimeout(function(){ isOwn.current = false; }, 0); }
  function cmd(c, v) { restSel(); document.execCommand(c, false, v || null); setTimeout(handleInput, 0); }
  function closeAll() { setShowColors(false); setShowHigh(false); }

  function clearFontSizes(node) { if (node.nodeType === 1 && node.style && node.style.fontSize) node.style.fontSize = ''; for (var c = 0; c < node.childNodes.length; c++) clearFontSizes(node.childNodes[c]); }
  function applyFontPx(px) {
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    var range = sel.getRangeAt(0);
    var frag = range.extractContents();
    clearFontSizes(frag);
    var span = document.createElement('span');
    span.style.fontSize = px + 'px';
    span.appendChild(frag);
    range.insertNode(span);
    var nr = document.createRange(); nr.selectNodeContents(span);
    sel.removeAllRanges(); sel.addRange(nr);
    setTimeout(handleInput, 0);
  }
  function stepFont(dir) {
    var SIZES = [10,12,14,16,18,20,24,28,32,36,42,48,64];
    var sel = window.getSelection();
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return;
    var node = sel.anchorNode; if (node && node.nodeType === 3) node = node.parentElement;
    var currentPx = 14;
    while (node && node !== ref.current) { var fs = node.style && node.style.fontSize; if (fs) { currentPx = parseInt(fs); break; } node = node.parentElement; }
    var idx = 2;
    for (var i = 0; i < SIZES.length; i++) { if (Math.abs(SIZES[i] - currentPx) < Math.abs(SIZES[idx] - currentPx)) idx = i; }
    applyFontPx(SIZES[Math.max(0, Math.min(SIZES.length - 1, idx + dir))]);
  }
  function resetFont() { applyFontPx(14); }
  function applyHighlight(c) {
    if (c !== 'transparent') lastHigh.current = c;
    if (c === 'transparent') { document.execCommand('removeFormat', false, null); }
    else { var ok = document.execCommand('hiliteColor', false, c); if (!ok) document.execCommand('backColor', false, c); }
    handleInput(); closeAll();
  }
  function handleKeyDown(e) {
    var mod = e.metaKey || e.ctrlKey;
    if (mod && (e.key === 'b' || e.key === 'B')) { e.preventDefault(); cmd('bold'); return; }
    if (mod && (e.key === 'i' || e.key === 'I')) { e.preventDefault(); cmd('italic'); return; }
    if (mod && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); cmd('underline'); return; }
    if (e.altKey && (e.code === 'Equal' || e.code === 'NumpadAdd')) { e.preventDefault(); stepFont(1); return; }
    if (e.altKey && (e.code === 'Minus' || e.code === 'NumpadSubtract')) { e.preventDefault(); stepFont(-1); return; }
    if (e.altKey && (e.code === 'Digit0' || e.code === 'Numpad0')) { e.preventDefault(); resetFont(); return; }
    if (e.altKey && e.code === 'KeyH') { e.preventDefault(); applyHighlight(lastHigh.current); }
  }
  var COLORS = ['#000000','#D85A30','#D4537E','#534AB7','#1D9E75','#378ADD','#C88A00','#639922','#888888'];
  var HIGHS  = ['#FFE99B','#FFD700','#B5F5B5','#ADD8E6','#FFB6C1','#DDD8F8','transparent'];
  var btn = {fontSize:12,padding:'3px 6px',borderRadius:5,border:'1px solid #e0ddd5',background:'#fff',cursor:'pointer',fontFamily:'inherit',lineHeight:'1.4',minWidth:24,textAlign:'center'};

  return (
    <div style={{ border:'1.5px solid #e6e3da', borderRadius:7, background:'#fff', marginTop:8, position:'relative' }}>

        <button onMouseDown={function(e){e.preventDefault();saveSel();cmd('italic');}} style={Object.assign({},btn,{fontStyle:'italic'})} title="Italic (⌘I)">I</button>
        <button onMouseDown={function(e){e.preventDefault();saveSel();cmd('underline');}} style={Object.assign({},btn,{textDecoration:'underline'})} title="Underline (⌘U)">U</button>
        <div style={{width:1,height:18,background:'#ddd',margin:'0 2px'}} />
        <button onMouseDown={function(e){e.preventDefault();stepFont(1);}} style={btn} title="Bigger (⌥=)">A+</button>
        <button onMouseDown={function(e){e.preventDefault();stepFont(-1);}} style={btn} title="Smaller (⌥-)">A−</button>
        <div style={{width:1,height:18,background:'#ddd',margin:'0 2px'}} />
        <div style={{position:'relative'}}>
          <button onMouseDown={function(e){e.preventDefault();saveSel();setShowColors(function(v){return !v;});setShowHigh(false);}} style={btn} title="Text color"><span style={{fontWeight:800,color:'#D85A30'}}>A</span></button>
          {showColors && (

              {COLORS.map(function(c){ return (<div key={c} onMouseDown={function(e){e.preventDefault();restSel();document.execCommand('foreColor',false,c);handleInput();closeAll();}} style={{width:22,height:22,background:c,borderRadius:4,cursor:'pointer',border:'1.5px solid transparent'}} />); })}
            </div>
          )}
        </div>
        <div style={{position:'relative'}}>
          <button onMouseDown={function(e){e.preventDefault();saveSel();setShowHigh(function(v){return !v;});setShowColors(false);}} style={btn} title="Highlight (⌥H)"><span style={{background:'#FFD700',padding:'0 3px',fontWeight:700,fontSize:11}}>H</span></button>
          {showHigh && (
            <div style={{position:'absolute',top:'110%',left:0,zIndex:300,background:'#fff',border:'1px solid #e6e3da',borderRadius:8,padding:8,display:'flex',flexWrap:'wrap',gap:4,width:120,boxShadow:'0 4px 16px rgba(0,0,0,0.12)'}}>
              {HIGHS.map(function(c){ return (<div key={c} onMouseDown={function(e){e.preventDefault();restSel();applyHighlight(c);}} style={{width:22,height:22,background:c==='transparent'?'repeating-linear-gradient(45deg,#ccc,#ccc 3px,#fff 3px,#fff 6px)':c,borderRadius:4,cursor:'pointer',border:'1.5px solid #e6e3da'}} />); })}
            </div>
          )}
        </div>
      </div>
      <div ref={ref} contentEditable={true} suppressContentEditableWarning={true} onInput={handleInput} onKeyDown={handleKeyDown} onBlur={saveSel}
        style={{minHeight:80,padding:'10px 12px',outline:'none',fontSize:14,lineHeight:1.7,color:'#333',background:'#fff',borderRadius:'0 0 5px 5px'}} />

    </div>
  );
}

// ── QuestionCard ──────────────────────────────────────────────
function QuestionCard({ qObj, checked, onCheck, answer, onAnswer, wrongCount }) {
  var [showAns, setShowAns] = React.useState(false);
  var done = !!checked[qObj.id];
  var missed = (wrongCount || 0) > 0;
  var flagged = isYahya(qObj.id, answer);
  return (
    <div style={{ background: done ? '#f4fbf7' : '#fff', border: '1.5px solid ' + (done ? '#b8e6cc' : missed ? '#f9c8b8' : '#ebe8e0'), borderRadius: 10, marginBottom: 8, overflow: 'hidden' }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '11px 14px' }}>
        <input type="checkbox" checked={done} onChange={function(){ onCheck(qObj.id); }} />
        <div style={{ flex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 8 }}>
            <span style={{ fontSize: 13.5, color: done ? '#2a7a50' : '#1a1a1a', textDecoration: done ? 'line-through' : 'none', opacity: done ? 0.7 : 1 }}>{qObj.question}</span>
            <div style={{ display: 'flex', alignItems: 'center', gap: 5, flexShrink: 0 }}>
              {flagged && <span title="Old answer written for a different CV (Yahya). Rewrite in your voice." style={{ background: '#fdeccf', color: '#9a6a16', borderRadius: 99, fontSize: 10, fontWeight: 700, padding: '1px 6px' }}>⚠ old</span>}
              {missed && <span style={{ background: '#fcd3c0', color: '#b03a1a', borderRadius: 99, fontSize: 10, fontWeight: 700, padding: '1px 6px' }}>✗ {wrongCount}</span>}
              <button onClick={function(){ setShowAns(function(a){ return !a; }); }} style={{ fontSize: 11, padding: '3px 8px', borderRadius: 6, border: '1px solid #e0ddd5', background: showAns ? '#f0eee7' : '#fff', cursor: 'pointer', color: '#555', fontWeight: 600 }}>
                {showAns ? 'Hide' : (answer ? 'Answer •' : 'Answer')}
              </button>
            </div>
          </div>
          {showAns && flagged && (
            <div style={{ marginTop: 8, padding: '8px 11px', background: '#fdf6e9', border: '1px solid #f0dcb4', borderRadius: 7, fontSize: 12.5, color: '#8a6516' }}>
              ⚠ This saved answer was written for a different candidate's CV. Use it only as a structure reference — rewrite it in your own voice and story.
            </div>
          )}
          {showAns && <RichTextEditor value={answer || ''} onChange={function(val){ onAnswer(qObj.id, val); }} placeholder="Write your answer here..." />}
        </div>
      </div>
    </div>
  );
}

// ── SubgroupSection ───────────────────────────────────────────
function SubgroupSection({ cat, catIdx, sg, sgIdx, filter, checked, onCheck, answers, onAnswer, wrongCounts }) {
  var [open, setOpen] = React.useState(false);
  var questions = allQuestions.filter(function(q){ return q.catIdx === catIdx && q.sgIdx === sgIdx; });
  var visible = questions;
  if (filter === 'incomplete') visible = questions.filter(function(q){ return !checked[q.id]; });
  if (filter === 'review') visible = questions.filter(function(q){ return (wrongCounts[q.id] || 0) > 0; });
  var done = questions.filter(function(q){ return checked[q.id]; }).length;
  var total = questions.length;
  var pct = total > 0 ? Math.round(done/total*100) : 0;
  if (filter !== 'all' && visible.length === 0) return null;
  return (
    <div style={{ marginBottom: 6 }}>
      <div onClick={function(){ setOpen(function(o){ return !o; }); }} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 12px', borderRadius: open ? '8px 8px 0 0' : 8, background: '#f6f4ee', cursor: 'pointer', userSelect: 'none', border: '1px solid ' + (open ? cat.color : '#ebe8e0') }}>
        <span style={{ flex: 1, fontSize: 13.5, fontWeight: 600, color: '#2a2a2a' }}>{sg.name}</span>
        <span style={{ fontSize: 12, color: pct === 100 ? '#1D9E75' : '#999', fontWeight: 600, minWidth: 36, textAlign: 'right' }}>{done}/{total}</span>
        <div style={{ width: 52, height: 5, background: '#e6e3da', borderRadius: 99, overflow: 'hidden', flexShrink: 0 }}>
          <div style={{ width: pct+'%', height: '100%', background: pct === 100 ? '#1D9E75' : cat.color, borderRadius: 99 }} />
        </div>
        <span style={{ fontSize: 14, color: '#bbb', transform: open ? 'rotate(90deg)' : 'none', transition: 'transform 0.15s' }}>›</span>
      </div>
      {open && (
        <div style={{ border: '1px solid ' + cat.color, borderTop: 'none', borderRadius: '0 0 8px 8px', padding: '10px', background: '#fff' }}>
          {visible.length === 0 ? <div style={{ padding: '12px', color: '#999', fontSize: 13, textAlign: 'center' }}>No questions match this filter.</div>
            : visible.map(function(q) { return <QuestionCard key={q.id} qObj={q} checked={checked} onCheck={onCheck} answer={answers[q.id]} onAnswer={onAnswer} wrongCount={wrongCounts[q.id] || 0} />; })}
        </div>
      )}
    </div>
  );
}

// ── CategorySection ───────────────────────────────────────────
